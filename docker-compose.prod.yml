services:
  # ─── MongoDB ────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: writesphere-mongodb
    restart: always
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: writesphere
    networks:
      - writesphere-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Redis ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: writesphere-redis
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - writesphere-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Backend ────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: writesphere-backend
    restart: always
    volumes:
      - ./uploads:/app/uploads
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/writesphere
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - writesphere-network

  # ─── Frontend ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: writesphere-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_APP_NAME: WriteSphere
    depends_on:
      - backend
    networks:
      - writesphere-network

  # ─── Nginx Reverse Proxy ────────────────────
  nginx:
    image: nginx:alpine
    container_name: writesphere-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./uploads:/var/www/uploads:ro
    depends_on:
      - frontend
      - backend
    networks:
      - writesphere-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  writesphere-network:
    driver: bridge
